$schema: ../../.moon/cache/schemas/project.json
stack: backend
layer: application
language: typescript

tasks:
  check:
    options:
      cache: local
  fix:
    options:
      cache: false
  tsc:
    options:
      cache: local
  knip:
    command: bun --bun knip --workspace apps/factory
    options:
      runFromWorkspaceRoot: true
      mergeArgs: replace
      cache: local
  test:
    command: node --test tests/issue-workflow.test.ts tests/discovery.test.ts tests/github-discovery.test.ts tests/graph-planning.test.ts tests/local-service.test.ts tests/captured-worker.test.ts tests/external-delivery.test.ts tests/github-delivery.test.ts tests/standalone-publication.test.ts tests/github-publication.test.ts tests/execution.test.ts tests/triage.test.ts tests/telegram.test.ts tests/github-triage.test.ts tests/graph-integration.test.ts tests/eve-local-recovery.test.ts tests/telegram-operations.test.ts tests/rollout.test.ts tests/production-resources.test.ts tests/production-config.test.ts
    options:
      cache: false
  test-eve:
    command: node --test tests/eve-host.test.ts tests/graph-reconciliation-eve.test.ts
    options:
      cache: false
  test-service:
    command: node --test tests/service-process.test.ts
    options:
      cache: false
  test-production:
    command: node --test tests/rollout.test.ts tests/production-config.test.ts tests/production-service.test.ts
    options:
      cache: false

  test-docker:
    command: node --test tests/docker-worker.test.ts
    options:
      cache: false

  test-triage-docker:
    command: node --test tests/triage-docker.test.ts
    options:
      cache: false

  fixture-triage-github:
    command: node tests/live-triage.ts
    options:
      cache: false

  test-docker-integration:
    command: node --test tests/docker-integration.test.ts
    options:
      cache: false

  test-docker-acceptance:
    command: node --test tests/docker-acceptance.test.ts
    options:
      cache: false

  test-resources:
    command: node --test tests/production-resources.test.ts
    options:
      cache: false

  test-live-runner:
    command: node --test fixtures/live/*.test.ts
    options:
      cache: false
