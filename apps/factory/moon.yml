$schema: ../../.moon/cache/schemas/project.json
stack: backend
layer: application
language: typescript

tasks:
  check:
    options:
      cache: local
  fix:
    options:
      cache: false
  tsc:
    options:
      cache: local
  knip:
    command: bun --bun knip --workspace apps/factory
    options:
      runFromWorkspaceRoot: true
      mergeArgs: replace
      cache: local
  test:
    command: node --test tests/issue-workflow.test.ts tests/discovery.test.ts tests/github-discovery.test.ts tests/graph-planning.test.ts tests/local-service.test.ts tests/captured-worker.test.ts tests/external-delivery.test.ts tests/github-delivery.test.ts tests/standalone-publication.test.ts tests/github-publication.test.ts tests/execution.test.ts tests/graph-integration.test.ts
    options:
      cache: false
  test-eve:
    command: node --test tests/eve-host.test.ts
    options:
      cache: false
  test-service:
    command: node --test tests/service-process.test.ts
    options:
      cache: false

  test-docker:
    command: node --test tests/docker-worker.test.ts
    options:
      cache: false

  test-docker-integration:
    command: node --test tests/docker-integration.test.ts
    options:
      cache: false
