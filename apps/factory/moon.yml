$schema: ../../.moon/cache/schemas/project.json
stack: backend
layer: application
language: typescript

tasks:
  check:
    options:
      cache: local
  fix:
    options:
      cache: false
  tsc:
    options:
      cache: local
  knip:
    command: bun --bun knip --workspace apps/factory
    options:
      runFromWorkspaceRoot: true
      mergeArgs: replace
      cache: local
  test:
    command: node --test tests/issue-workflow.test.ts tests/captured-worker.test.ts
    options:
      cache: false
  test-eve:
    command: node --test tests/eve-host.test.ts
    options:
      cache: false

  test-docker:
    command: node --test tests/docker-worker.test.ts
    options:
      cache: false
