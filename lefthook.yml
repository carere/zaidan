commit-msg:
  commands:
    conventional-commit:
      run: cog verify --file {1}

pre-commit:
  commands:
    sort-package-json:
      glob: "package.json"
      run: bun sort-package-json {staged_files}
      stage_fixed: true
    check:
      glob: "*.{js,ts,tsx,json,jsonc,html,css}"
      # The glob matches by basename, so built registry JSON under public/
      # reaches biome, which ignores those paths and then exits 1 on having
      # processed nothing — failing every registry rebuild commit.
      run: bun biome check --write --no-errors-on-unmatched {staged_files}
      stage_fixed: true
