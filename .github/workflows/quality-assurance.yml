name: Quality Assurance

on:
  push:
    branches:
      - "**"
  pull_request:
    branches:
      - main
    types: [opened, synchronize, reopened, ready_for_review]

jobs:
  static-test:
    runs-on: ubuntu-latest
    steps:
      - name: Git Checkout
        uses: actions/checkout@v6.0.2

      - name: Set up Cargo Binstall
        uses: cargo-bins/cargo-binstall@main

      - name: Install commitlint
        run: cargo-binstall commitlint-rs

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2.2.0
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Biome Lint + Format
        run: bun run check

      - name: Cache Moon validation artifacts
        uses: actions/cache@v5.0.5
        with:
          path: |
            .moon/cache
            .output
            .velite
            public/r/kobalte
          key: ${{ runner.os }}-moon-${{ hashFiles('.moon/**', 'moon.yml',
            'vite.config.ts', 'vitest.config.ts', 'velite.config.ts', 'tests/**',
            'src/**', 'public/**', 'package.json', 'bun.lock') }}

      - name: Assuring build is working
        run: bun run build

      - name: Assuring registry build is working
        run: bun run r:build:kobalte

      - name: TypeScript Compiler
        run: bun run compile

      - name: Validate current commit (last commit)
        if: github.event_name == 'push'
        run: |
          git --no-pager log -1 --format="%s" > last_commit_msg.txt
          commitlint --edit last_commit_msg.txt
