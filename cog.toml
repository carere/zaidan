branch_whitelist = ["main"]

# Covers merges that keep git's own message: `cog check` spots them by parent
# count, and `cog verify` — which only ever sees the message the commit-msg
# hook hands it — by the default "Merge …" subject. A hand-written subject is
# covered by the `merge` commit type below instead.
ignore_merge_commits = true

pre_bump_hooks = [
  "bun pm version {{version}} --no-git-tag-version",
  "git add package.json",
]

pre_package_bump_hooks = [
  "bun pm version {{version}} --no-git-tag-version",
  "git add package.json",
]

post_bump_hooks = ["git push origin HEAD:$GITHUB_REF_NAME", "git push --tags"]

[commit_types.build]
bump_patch = true

[commit_types.chore]
bump_patch = true

# `merge: <what was merged>` — for merge commits written by hand, which the
# built-in types have no room for. No bump flag: a merge introduces no change
# of its own, and every commit it brings in is already accounted for.
[commit_types.merge]
omit_from_changelog = true

[commit_types.perf]
bump_patch = true

[commit_types.refactor]
bump_patch = true

[commit_types.revert]
bump_patch = true

[commit_types.style]
bump_patch = true

[[changelog.authors]]
signature = "contact@carere.dev"
username = "carere"
