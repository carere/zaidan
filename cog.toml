branch_whitelist = ["main"]

# A merge commit is not a conventional commit and never will be. Without this,
# `cog verify` rejects the commit-msg hook's own merge message and `cog check`
# fails on any merge already in history. Detection is by parent count for real
# commits, and by git's default "Merge …" message in the hook — so let git
# write the merge message rather than passing -m.
ignore_merge_commits = true

pre_bump_hooks = [
  "bun pm version {{version}} --no-git-tag-version",
  "git add package.json",
]

pre_package_bump_hooks = [
  "bun pm version {{version}} --no-git-tag-version",
  "git add package.json",
]

post_bump_hooks = ["git push origin HEAD:$GITHUB_REF_NAME", "git push --tags"]

[commit_types.build]
bump_patch = true

[commit_types.chore]
bump_patch = true

[commit_types.perf]
bump_patch = true

[commit_types.refactor]
bump_patch = true

[commit_types.revert]
bump_patch = true

[commit_types.style]
bump_patch = true

[[changelog.authors]]
signature = "contact@carere.dev"
username = "carere"
