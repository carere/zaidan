$schema: ./.moon/cache/schemas/project.json

stack: frontend
layer: application

tasks:
  dev:
    command: bun vite dev
    description: Start Zaidan in development mode
    env:
      CLOUDFLARE_LOAD_DEV_VARS_FROM_DOT_ENV: "false"
    preset: server
    # Persistent server task: never cached, so skip input hashing entirely.
    # Without this, moon defaults inputs to the whole project tree and pipes
    # ~350k files (node_modules, symlinked skills) to `git hash-object`,
    # stalling startup for 40-60s before vite ever launches.
    inputs: []

  build:
    command: bun vite build
    description: Build Zaidan
    env:
      CLOUDFLARE_LOAD_DEV_VARS_FROM_DOT_ENV: "false"
    inputs:
      - "@group(configs)"
      - "@group(sources)"
      - "@group(workspace)"
    outputs:
      - "dist/"
    type: build

  preview:
    command: bun vite preview
    description: Preview the production build
    env:
      CLOUDFLARE_LOAD_DEV_VARS_FROM_DOT_ENV: "false"
    preset: server
    # Persistent server task: skip input hashing (see `dev` above).
    inputs: []

  r-build-kobalte:
    command: bun shadcn build src/registry/kobalte/registry.json --output public/r/kobalte
    description: Build the Kobalte registry

  r-validate-kobalte:
    command: bun shadcn registry validate src/registry/kobalte/registry.json
    description: Validate the Kobalte registry
