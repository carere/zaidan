$schema: ./.moon/cache/schemas/project.json

stack: frontend
layer: application

tasks:
  dev:
    command: bun vite dev
    description: Start Zaidan in development mode
    env:
      CLOUDFLARE_LOAD_DEV_VARS_FROM_DOT_ENV: "false"
    preset: server

  build:
    command: bun vite build
    description: Build Zaidan
    env:
      CLOUDFLARE_LOAD_DEV_VARS_FROM_DOT_ENV: "false"
    inputs:
      - "@group(configs)"
      - "@group(sources)"
      - "@group(workspace)"
    outputs:
      - "dist/"
    type: build

  preview:
    command: bun vite preview
    description: Preview the production build
    env:
      CLOUDFLARE_LOAD_DEV_VARS_FROM_DOT_ENV: "false"
    preset: server

  r-build-kobalte:
    command: bun shadcn build src/registry/kobalte/registry.json --output public/r/kobalte
    description: Build the Kobalte registry

  r-validate-kobalte:
    command: bun shadcn registry validate src/registry/kobalte/registry.json
    description: Validate the Kobalte registry
