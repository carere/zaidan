$schema: ./.moon/cache/schemas/project.json
layer: application
language: typescript

tasks:
  check:
    inputs:
      - "apps/*/src/**/*"
      - "apps/*/*.{json,jsonc,ts}"
      - "apps/website/tests/browser/**/*"
      - "*.json"
    options:
      cache: local
  fix:
    options:
      cache: false
  tsc:
    command: noop
    deps:
      - zaidan:tsc
      - factory:tsc
    options:
      cache: local
  knip:
    inputs:
      - "apps/*/src/**/*"
      - "apps/*/*.{json,jsonc,ts}"
      - "apps/website/tests/browser/**/*"
      - "docs/examples/pi-eve-compatibility/*.{mjs,ts,json}"
      - "docs/examples/pi-eve-compatibility/agent/**/*.ts"
      - "docs/examples/pi-eve-compatibility/worker/*.{mjs,ts}"
      - "*.json"
    options:
      cache: local
