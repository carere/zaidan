$schema: ../cache/schemas/tasks.json

fileGroups:
  configs:
    - "moon.yml"
    - "package.json"
    - "tsconfig.json"
    - "knip.json"
    - "*.jsonc"
    - "*.config.{js,ts,cjs,mjs,mts}"
  sources:
    - "src/**/*"
  workspace:
    - "/.moon/tasks/**/*"
    - "/.moon/toolchains.yml"
    - "/.moon/workspace.yml"
    - "/biome.json"
    - "/bun.lock"
    - "/package.json"
    - "/tsconfig.json"
    - "/tsconfig.options.json"

implicitInputs:
  - "/.moon/tasks/**/*"
  - "/.moon/toolchains.yml"
  - "/.moon/workspace.yml"
  - "/biome.json"
  - "/bun.lock"
  - "/package.json"
  - "/tsconfig.json"
  - "/tsconfig.options.json"

tasks:
  check:
    command: "bun --bun biome check --no-errors-on-unmatched ."

  fix:
    command: "bun --bun biome check --write --no-errors-on-unmatched ."
    options:
      cache: false

  tsc:
    command: "bun --bun tsc --noEmit"

  knip:
    command: "bun --bun knip"
